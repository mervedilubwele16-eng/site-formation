# Configuration de l'agent de trading
# Commencez TOUJOURS en mode "paper" (simulation) pendant plusieurs semaines.
mode: paper
symbols: [BTCUSDT]
interval: 1d            # bougies d'une journée : la stratégie a été validée sur ce réglage
loop_seconds: 300       # l'agent vérifie toutes les 5 minutes s'il y a une nouvelle bougie
capital_initial: 1000   # capital fictif pour la simulation (USDT)
fees: 0.001
objectif_gain: 12000    # en $ (USDT) : quand le gain atteint ce montant, l'agent vend tout et s'arrête. 0 = désactivé

strategy:
  type: tendance          # "tendance" (recommandée) ou "classique" (ancienne version, perdante)
  sma_periods: [50, 100, 150]
  donchian_periods: [20, 55]
  donchian_exit_frac: 0.5
  vol_cible: 0.20         # niveau de risque : 0.20 prudent, 0.30 modéré, 0.40 dynamique
  vol_window: 30
  rebalance_seuil: 0.10
  stop_secours_atr: 6.0   # stop de secours (≈ 20 % sous le prix), utile si l'ordinateur est éteint

risk:
  max_daily_loss: 0.05        # pause jusqu'au lendemain après -5 % sur la journée
  max_drawdown: 0.25          # arrêt complet après -25 % depuis le plus haut
  max_volatility_pct: 0.08    # aucun achat si le marché bouge de plus de 8 % par jour
  cooldown_bars: 3            # 3 jours de pause après un stop de secours
